<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}RigBuilder — AI-Powered PC Recommendations{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- <link rel="stylesheet" href="{{ url_for('static', filename='css/recommendetion_style.css') }}"> -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/about.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/cart_style.css') }}">
</head>
<body>

    <header class="site-header">
        <nav class="navbar" aria-label="Main Navigation">
            <!-- Logo -->
            <a href="{{ url_for('home') }}" class="logo" aria-label="RigBuilder Homepage">
                RigBuilder
            </a>

            <!-- Mobile Menu Toggle Button -->
            <button class="nav-toggle" id="navToggle" aria-label="Toggle Navigation Menu" aria-expanded="false" aria-controls="navLinks">
                <span class="nav-toggle-line"></span>
                <span class="nav-toggle-line"></span>
                <span class="nav-toggle-line"></span>
            </button>

            <!-- Navigation Links -->
            <div class="nav-links" id="navLinks">
                <a href="{{ url_for('home') }}">Home</a>
                <a href="{{ url_for('about') }}">About</a>
                <a href="{{ url_for('recommendation') }}">PC Builder</a>
            
                {% if session.get("user_id") %}
                    <div class="user-menu">
                        <span class="username">
                            <span class="user-icon" aria-hidden="true">👤</span>
                            {{ session.get("user_name") }}
                        </span>
                        <a  href="{{ url_for('cart') }}">🛒 View Cart</a>
                        <a href="{{ url_for('logout') }}" class="nav-action nav-logout">Logout</a>
                    </div>


                {% else %}
                    <div class="auth-nav">
                        <a href="{{ url_for('login') }}"  class="nav-action">Login</a>
                        <a href="{{ url_for('signup') }}" class="nav-action">Sign Up</a>
                    </div>
                {% endif %}
            </div>
        </nav>
    </header>

    <!-- Page Content -->
    <main id="main-content">
        {% block content %}{% endblock %}
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const navToggle = document.getElementById('navToggle');
            const navLinks = document.getElementById('navLinks');

            if (navToggle && navLinks) {
                navToggle.addEventListener('click', () => {
                    const isExpanded = navToggle.getAttribute('aria-expanded') === 'true';
                    navToggle.setAttribute('aria-expanded', !isExpanded);
                    navLinks.classList.toggle('nav-open');
                });
            }
        });
    </script>
</body>
</html>
